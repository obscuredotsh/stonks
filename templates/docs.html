<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs · NSE swing scanner</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #131a2a;
      --panel-2: #1b2438;
      --border: #2a3650;
      --text: #e6edf3;
      --muted: #8b96ad;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --cyan: #22d3ee;
      --link: #60a5fa;
      --link-hover: #93c5fd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
            system-ui, sans-serif; }

    /* ── top bar ─────────────────────────────────────────── */
    .topbar { position: sticky; top: 0; z-index: 5;
      background: rgba(11, 15, 26, .85); backdrop-filter: saturate(140%) blur(8px);
      border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em;
      color: var(--text); text-decoration: none; }
    .brand small { color: var(--muted); font-weight: 400; margin-left: 6px;
      font-size: 12px; }
    .nav a { color: var(--muted); text-decoration: none; padding: 6px 10px;
      border-radius: 8px; font-size: 13px; }
    .nav a:hover { color: var(--text); background: var(--panel); }
    .nav a.active { color: var(--cyan); background: var(--panel); }

    /* ── layout ──────────────────────────────────────────── */
    .layout { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px;
      display: grid; grid-template-columns: 240px 1fr; gap: 40px; }
    aside { position: sticky; top: 64px; align-self: start;
      max-height: calc(100vh - 80px); overflow-y: auto; padding-right: 8px; }
    aside .toc-title { color: var(--muted); font-size: 11px;
      text-transform: uppercase; letter-spacing: .1em; margin: 0 0 8px; }
    aside .toc { font-size: 13px; }
    aside .toc ul { list-style: none; padding-left: 12px; margin: 0; border-left: 1px solid var(--border); }
    aside .toc > ul { padding-left: 0; border-left: 0; }
    aside .toc li { margin: 4px 0; }
    aside .toc a { color: var(--muted); text-decoration: none;
      display: block; padding: 3px 8px; border-radius: 6px;
      border-left: 2px solid transparent; margin-left: -2px; }
    aside .toc a:hover { color: var(--text); background: var(--panel); }
    aside .toc a.active { color: var(--cyan); border-left-color: var(--cyan); background: var(--panel); }

    /* ── prose ───────────────────────────────────────────── */
    article { min-width: 0; }
    article h1, article h2, article h3, article h4 { letter-spacing: -.01em;
      line-height: 1.25; scroll-margin-top: 72px; }
    article h1 { font-size: 28px; margin: 0 0 16px; }
    article h2 { font-size: 22px; margin: 40px 0 12px;
      padding-top: 16px; border-top: 1px solid var(--border); }
    article h3 { font-size: 17px; margin: 28px 0 8px; color: var(--cyan); }
    article h4 { font-size: 14px; margin: 20px 0 6px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); }
    article p, article li { color: var(--text); }
    article a { color: var(--link); text-decoration: none; }
    article a:hover { color: var(--link-hover); text-decoration: underline; }
    article strong { color: #fff; }
    article em { color: var(--text); }

    article blockquote { margin: 16px 0; padding: 12px 16px;
      border-left: 3px solid var(--yellow);
      background: rgba(245, 158, 11, .05);
      border-radius: 0 8px 8px 0; color: #fde68a; }
    article blockquote p { margin: 4px 0; }
    article blockquote strong { color: #fef3c7; }

    article ul, article ol { padding-left: 22px; }
    article li { margin: 4px 0; }
    article hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }

    /* tables */
    article table { width: 100%; border-collapse: collapse; margin: 16px 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; font-size: 13px; }
    article th, article td { padding: 10px 14px; text-align: left;
      border-bottom: 1px solid var(--border); vertical-align: top; }
    article thead th { background: var(--panel-2); font-size: 11px;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    article tbody tr:last-child td { border-bottom: 0; }
    article tbody tr:hover { background: var(--panel-2); }

    /* code */
    article code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; background: var(--panel-2); padding: 2px 6px;
      border-radius: 4px; color: #fcd34d; border: 1px solid var(--border); }
    article pre { background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; overflow-x: auto;
      margin: 16px 0; line-height: 1.5; }
    article pre code { background: transparent; padding: 0; border: 0;
      color: var(--text); font-size: 13px; }
    article .codehilite { background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; margin: 16px 0; }
    article .codehilite pre { margin: 0; border: 0; background: transparent; }

    /* heading permalinks (added by toc extension) */
    article .headerlink { opacity: 0; margin-left: 8px; color: var(--muted);
      text-decoration: none; font-weight: 400; transition: opacity .15s; }
    article h1:hover .headerlink, article h2:hover .headerlink,
    article h3:hover .headerlink, article h4:hover .headerlink { opacity: 1; }

    /* Pygments tokens (terse, dark-friendly) */
    .codehilite .k, .codehilite .kn, .codehilite .kd, .codehilite .kr { color: #c084fc; }
    .codehilite .s, .codehilite .s1, .codehilite .s2, .codehilite .se { color: #86efac; }
    .codehilite .c, .codehilite .c1, .codehilite .cm, .codehilite .cp { color: #6b7280; font-style: italic; }
    .codehilite .nb, .codehilite .nf, .codehilite .nc { color: #60a5fa; }
    .codehilite .mi, .codehilite .mf, .codehilite .mh, .codehilite .mo { color: #fca5a5; }
    .codehilite .o, .codehilite .ow { color: #f472b6; }
    .codehilite .n, .codehilite .nn, .codehilite .nv { color: var(--text); }

    /* responsive */
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; gap: 0; padding-top: 20px; }
      aside { position: static; max-height: none; border: 1px solid var(--border);
        background: var(--panel); border-radius: 10px; padding: 12px;
        margin-bottom: 20px; }
    }

    .footer { color: var(--muted); font-size: 12px; margin-top: 48px;
      padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">NSE swing scanner <small>composite signal · 7 voters · ADX gate</small></a>
      <nav class="nav">
        <a href="/">Scanner</a>
        <a href="/docs" class="active">Docs</a>
      </nav>
    </div>
  </div>

  <div class="layout">
    <aside>
      <p class="toc-title">On this page</p>
      <div class="toc">{{ toc }}</div>
    </aside>

    <article class="prose">
      {{ content }}
      <div class="footer">
        Source: <code>documentation.md</code> · edit that file and refresh to update this page.
      </div>
    </article>
  </div>

  <script>
    // Highlight the TOC entry that matches the section currently in view.
    (function () {
      const links = Array.from(document.querySelectorAll('aside .toc a[href^="#"]'));
      if (!links.length) return;
      const map = new Map();
      links.forEach(a => {
        const id = decodeURIComponent(a.getAttribute('href').slice(1));
        const el = document.getElementById(id);
        if (el) map.set(el, a);
      });
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          const a = map.get(e.target);
          if (!a) return;
          if (e.isIntersecting) {
            links.forEach(l => l.classList.remove('active'));
            a.classList.add('active');
          }
        });
      }, { rootMargin: '-72px 0px -65% 0px', threshold: 0 });
      map.forEach((_, el) => io.observe(el));
    })();
  </script>
</body>
</html>
